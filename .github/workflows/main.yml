---
name: Build and Push Image to AWS ECR
on:
  push:
    branches: [ development_environment, dev-auto-build]
permissions:
  contents: write
jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Automatic Tagging of Releases
      id: increment-git-tag
      env:
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        case "$BRANCH_NAME" in
          dev-auto-build)
            bash ./build/git_update.sh -v minor
            ;;
          development_environment)
            bash ./build/git_update.sh -v major
            ;;
          *)
            echo "Unsupported branch: $BRANCH_NAME"
            exit 1
            ;;
        esac

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, Tag, and Push the Image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: dialplan-manager-stats
        IMAGE_TAG: ${{ steps.increment-git-tag.outputs.git-tag }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f ./ci/Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
